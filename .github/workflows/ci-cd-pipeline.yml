name: Local package integrity CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fail closed on Python syntax errors
        run: python -m compileall -q package_integrity_gate.py tests
      - name: Real filesystem and subprocess regressions
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Compile and test local Rust placeholder
        run: cargo test --offline
